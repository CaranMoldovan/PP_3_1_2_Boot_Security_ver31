name: Build StudyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-study-tracker-umjup4
    paths:
      - "android-study-tracker/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-study-tracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-debug-apk
          path: android-study-tracker/app/build/outputs/apk/debug/app-debug.apk
