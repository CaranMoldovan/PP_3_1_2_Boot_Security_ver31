name: Build StudyTracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-study-tracker-umjup4
    paths:
      - "android-study-tracker/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-study-tracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-debug-apk
          path: android-study-tracker/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-study-tracker/app/build/outputs/apk/debug/app-debug.apk StudyTracker.apk
          gh release delete studytracker-latest --cleanup-tag --yes || true
          gh release create studytracker-latest StudyTracker.apk \
            --title "StudyTracker APK (последняя сборка)" \
            --notes "Установочный файл приложения StudyTracker. Скачайте StudyTracker.apk на телефон и откройте его для установки." \
            --target "$GITHUB_SHA" \
            --prerelease
